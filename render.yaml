services:
  # Background Worker for the Discord Bot
  - type: worker
    name: algorithm-arena-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter # You can use free/starter
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

  # Web Service for the Next.js Admin Dashboard
  - type: web
    name: algorithm-arena-dashboard
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    plan: starter # You can use free/starter
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
