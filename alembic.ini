# Alembic configuration for Algorithm Arena Bot

[alembic]
script_location = migrations
# URL is set at runtime by migrations/env.py from DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)-8s | %(name)-25s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S
